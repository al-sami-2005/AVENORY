/* ———————————————————————————————————————————
   NINETY 2.0 — NEW DESIGN LANGUAGE
   Accessible, tactile, responsive and motion-conscious.
——————————————————————————————————————————— */
:root {--bg:#f6f7fa;--surface:#ffffff;--surface2:#f5f6f9;--ink:#20263b;--muted:#77819a;--line:#e9eaf1;--accent:#6a5ce4;--accent-dark:#5244c9;--accent-wash:#f0eeff;--green:#259e75;--green-wash:#e6f8f0;--orange:#e99b58;--shadow:0 8px 30px rgba(34,42,74,.036);--radius:20px}
:root[data-theme='dark'] {--bg:#121725;--surface:#1b2232;--surface2:#252d40;--ink:#f4f5ff;--muted:#a6b1c6;--line:#333b50;--accent:#b4a7ff;--accent-dark:#9a8afa;--accent-wash:#302b48;--green:#74d4ab;--green-wash:#27463e;--orange:#f5ba84}
:focus-visible {outline:3px solid var(--accent);outline-offset:3px}
button {touch-action:manipulation}
.card,.stat-card,.shop-item {border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.card:hover {border-color:color-mix(in srgb,var(--line) 75%,var(--accent))}
.page-title {letter-spacing:-.075em;line-height:1.12}
.subhead {line-height:1.6}
.brand-symbol {box-shadow:0 5px 20px rgba(111,93,222,.18)}
.sidebar {box-shadow:4px 0 30px rgba(20,25,55,.012)}
.nav-item {transition:background .16s,color .16s,transform .16s}
.nav-item:active,.btn:active {transform:scale(.985)}
.btn {transition:background .16s,transform .16s,box-shadow .16s}
.btn-primary:hover {box-shadow:0 7px 20px rgba(104,87,213,.24)}
.mini-eyebrow {display:block;font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 9px}
.greeting-spark {color:var(--accent);font-size:.72em}
.xp-mini {margin-left:8px;font-size:9px;font-weight:800;letter-spacing:.025em;background:var(--accent-wash);color:var(--accent);padding:4px 6px;border-radius:7px;white-space:nowrap}
.habit-name {display:flex;align-items:center;flex-wrap:wrap;gap:1px}
.tiny-progress {margin-top:9px;height:4px;width:100%;max-width:145px;border-radius:100px;background:var(--line);overflow:hidden}
.tiny-progress span {display:block;background:linear-gradient(90deg,var(--accent),#7bcfb2);height:100%;border-radius:100px;transition:width .3s}
.habit-row.done .tiny-progress span {background:var(--green)}
.habit-row .tick {transition:transform .14s,background .14s}
.habit-row .tick:active {transform:scale(.87)}
.progress-fill,.ring-arc {transition:width .5s ease,stroke-dashoffset .6s ease}
.v2-hero {background:radial-gradient(ellipse at 93% 20%,#615cc7 0%,transparent 44%),linear-gradient(115deg,#1a2441 0%,#283358 58%,#3c386b 100%);border-radius:25px;min-height:253px;padding:39px 46px;display:flex;align-items:center;justify-content:space-between;gap:22px;position:relative;overflow:hidden;color:white;isolation:isolate;margin-bottom:18px;box-shadow:0 15px 35px rgba(31,35,71,.12)}
.v2-hero-copy {position:relative;z-index:2;min-width:0}
.v2-hero .hero-tag {display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.17);color:#e5e2ff;letter-spacing:.09em;gap:7px}
.v2-hero h2 {font-size:clamp(26px,3vw,41px);font-weight:840;line-height:1.14;letter-spacing:-.055em;margin:17px 0 10px}
.v2-hero h2 em {font-style:normal;color:#b6e9cd}
.v2-hero p {color:#d6d9ed;max-width:420px;line-height:1.6;font-size:12px;margin:0}
.v2-hero-foot {display:flex;flex-wrap:wrap;gap:18px;margin-top:24px;color:#e6e2ff;font-size:11px;font-weight:730}
.v2-hero-foot span {display:inline-flex;gap:6px;align-items:center}
.v2-hero-foot .icon {height:15px;width:15px}
.hero-ring {flex:0 0 auto;z-index:2;position:relative}
.v2-hero .ring-wrap svg circle:first-child {stroke:rgba(255,255,255,.14)}
.v2-hero .ring-wrap svg circle:last-child {stroke:#bfead8}
.v2-hero .ring-middle b {color:white;font-size:36px}
.v2-hero .ring-middle small {color:#e1e4f6}
.hero-decoration {position:absolute;right:-45px;top:-100px;font-size:340px;color:rgba(255,255,255,.032);line-height:1;transform:rotate(16deg);pointer-events:none}
.ring-wrap {position:relative;display:inline-block;flex-shrink:0}
.ring-wrap svg {display:block}
.ring-middle {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-middle b {font-size:24px;line-height:1;font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.ring-middle small {font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-top:8px}
.journey-ribbon {display:grid;grid-template-columns:minmax(140px,1fr) minmax(220px,2fr) auto;align-items:center;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px 26px;margin:0 0 20px}
.journey-ribbon .mini-eyebrow {margin-bottom:5px;font-size:9px}
.journey-ribbon h2 {font-size:28px;line-height:1.2;font-weight:850;letter-spacing:-.06em;margin:0;white-space:nowrap}
.journey-ribbon h2>span {font-size:16px;color:var(--muted);font-weight:550;margin-left:1px}
.journey-ribbon h2 small {display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:normal}
.ribbon-label,.ribbon-sub {display:flex;align-items:center;justify-content:space-between;gap:8px}
.ribbon-label {font-size:11px;font-weight:700;margin-bottom:9px}
.ribbon-label strong {color:var(--accent)}
.ribbon-sub {color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.03em;margin-top:7px}
.ribbon-total {border-left:1px solid var(--line);padding-left:24px;text-align:center;min-width:85px;display:grid;gap:3px}
.ribbon-total span,.ribbon-total small {font-size:10px;color:var(--muted)}
.ribbon-total b {font-size:24px;letter-spacing:-.05em;color:var(--accent)}
.stat-card {background:var(--surface)}
.stat-foot {line-height:1.55}
.micro-status {display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent-wash) 65%,var(--accent));color:var(--accent);border-radius:13px;padding:11px 14px;font-size:11px;font-weight:750}
.micro-status>span:nth-child(2) {flex:1}
.micro-status strong {white-space:nowrap}
.status-pulse {height:9px;width:9px;display:inline-block;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-wash);flex-shrink:0}
.new-dash-grid {align-items:start}
.xp-daily-card {padding:22px}
.xp-spark {background:var(--accent-wash);color:var(--accent);border-radius:10px;padding:10px;font-size:12px;font-weight:850;white-space:nowrap}
.daily-hero-meter {display:flex;align-items:center;gap:17px;margin:12px 0 19px}
.daily-xp-number {font-size:34px;letter-spacing:-.075em;font-weight:850;line-height:1;white-space:nowrap}
.daily-xp-number span {font-size:13px;color:var(--accent);letter-spacing:normal}
.daily-hero-meter p {line-height:1.5;font-size:10px;color:var(--muted);margin:9px 0}
.small-chip {display:inline-flex;font-size:10px;font-weight:770;background:var(--surface2);border-radius:8px;color:var(--muted);padding:6px 8px}
.xp-breakdown {display:grid;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 17px}
.xp-breakdown>div {display:flex;justify-content:space-between;padding:9px 2px;gap:10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.xp-breakdown>div:last-child {border-bottom:0}
.xp-breakdown strong {color:var(--green);font-weight:850;font-variant-numeric:tabular-nums}
.coach-card {padding:22px}
.coach-score {display:flex;align-items:center;gap:15px;background:var(--surface2);padding:12px 14px;border-radius:12px;margin:15px 0}
.coach-score strong {font-size:31px;letter-spacing:-.07em;white-space:nowrap}
.coach-score strong span {font-size:15px}
.coach-score .up {color:var(--green)}
.coach-score .down {color:#dc8054}
.coach-score p {font-size:11px;line-height:1.5;color:var(--muted);margin:0}
.coach-details {display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:17px}
.coach-details>div {padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.coach-details span {display:block;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.coach-details strong {font-size:11px;display:block;overflow-wrap:anywhere;margin-bottom:6px}
.coach-details small {font-size:10px;color:var(--green)}
.weekly-snapshot {padding:23px}
.seven-bars {height:165px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;align-items:end;margin-top:14px}
.seven-bars>button {background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;min-width:0;font-size:10px;font-weight:800;color:var(--muted);padding:0}
.seven-bars .seven-pillar {width:100%;height:112px;background:var(--surface2);border-radius:10px 10px 4px 4px;overflow:hidden;display:flex;align-items:flex-end;position:relative}
.seven-bars .seven-pillar i {width:100%;background:linear-gradient(0deg,var(--accent),#b0a7ff);border-radius:8px 8px 3px 3px;transition:height .25s}
.seven-bars button:hover .seven-pillar {outline:2px solid var(--accent);outline-offset:2px}
.seven-bars small {font-size:10px}
.insight-summary {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 20px}
.explorer-card {margin:0 0 20px;padding:26px}
.explorer-top {gap:13px;align-items:center;flex-wrap:wrap}
.segmented {display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:12px}
.segmented button {border:0;background:none;color:var(--muted);border-radius:9px;font-size:11px;font-weight:780;padding:9px 12px;white-space:nowrap}
.segmented button.active {background:var(--surface);color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.07)}
.period-bars {display:flex;align-items:stretch;gap:10px;overflow-x:auto;scrollbar-width:thin;margin:27px 0 15px;padding-bottom:6px;min-height:234px}
.period-bar {border:none;background:none;color:var(--muted);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1 0 38px;gap:9px;min-width:34px;cursor:pointer}
.period-bar:disabled {cursor:default;opacity:.55}
.period-bar small {font-size:9px;font-weight:750;white-space:nowrap}
.period-bar .bar-pct {color:var(--muted);font-size:9px;line-height:1;font-weight:800}
.period-column {display:flex;align-items:flex-end;background:var(--surface2);height:155px;width:100%;max-width:75px;border-radius:11px 11px 5px 5px;overflow:hidden}
.period-column>span {display:block;width:100%;background:linear-gradient(180deg,#aa9aff,var(--accent));border-radius:10px 10px 4px 4px;transition:height .25s}
.period-bar.selected .period-column {outline:2px solid var(--accent);outline-offset:3px}
.period-bar.selected .bar-pct {color:var(--accent)}
.period-bar:hover:not(:disabled) .period-column {filter:brightness(1.1)}
.period-bars.day-bars .period-bar {min-width:35px}
.period-bars.week-bars .period-bar {min-width:42px}
.period-bars.month-bars .period-bar {min-width:80px}
.period-detail {padding:15px 18px;background:var(--surface2);border-radius:14px;display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-top:11px}
.period-detail h3 {margin:3px 0 0;font-size:15px}
.period-detail strong {display:block;font-size:21px;letter-spacing:-.05em;color:var(--accent)}
.period-detail small {display:block;color:var(--muted);font-size:10px;margin-top:3px}
.period-detail .btn {margin-left:auto}
.chapter-card {padding:27px;margin-bottom:20px}
.chapter-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:17px}
.chapter {border:1px solid var(--line);background:var(--surface2);border-radius:16px;display:flex;align-items:center;flex-direction:column;gap:12px;padding:19px 7px;text-align:center}
.chapter>span {font-size:9px;color:var(--muted);font-weight:850;letter-spacing:.13em}
.chapter>b {font-size:12px}
.chapter>small {font-size:10px;color:var(--muted)}
.chapter .ring-middle b {font-size:19px}
.chapter .ring-middle small {font-size:8px}
.heatmap-card {margin-bottom:20px}
.reward-wallet {display:flex;gap:22px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:23px 26px;margin:0 0 22px}
.reward-wallet h2 {font-size:37px;letter-spacing:-.08em;margin:0;color:var(--accent)}
.reward-wallet h2 small {font-size:14px;letter-spacing:normal}
.reward-wallet p {font-size:11px;color:var(--muted);margin:5px 0 0}
.reward-wallet-copy {max-width:330px;border-left:1px solid var(--line);padding-left:20px}
.reward-wallet-copy strong {font-size:13px}
.reward-wallet-copy p {line-height:1.5}
.shop-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shop-item {padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.shop-emoji {font-size:29px;margin-bottom:3px}
.shop-item h3 {margin:0;font-size:14px;letter-spacing:-.02em}
.shop-item p {color:var(--muted);font-size:11px;line-height:1.65;margin:0 0 13px;min-height:29px}
.shop-bottom {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.shop-bottom strong {color:var(--accent);font-size:14px;white-space:nowrap}
.redemption-card {padding:24px;margin-top:20px}
.redemption-list>div {display:flex;gap:14px;justify-content:space-between;padding:13px 0;font-size:12px;border-top:1px solid var(--line)}
.redemption-list small {color:var(--muted)}
.redemption-list b {color:var(--accent);white-space:nowrap}
.notification-health {display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface2);border-radius:13px;margin-top:19px;font-size:11px}
.notification-health b {display:block;margin-bottom:4px}
.notification-health small {color:var(--muted);line-height:1.5}
#celebration-root {pointer-events:none;position:fixed;inset:0;z-index:999;overflow:hidden}
#celebration-root i {position:absolute;top:-25px;left:var(--x);width:9px;height:17px;background:var(--color);border-radius:2px;opacity:0;animation:celebration-fall 1.3s ease-in var(--delay) forwards;transform:rotate(19deg)}
@keyframes celebration-fall {0%{opacity:0;transform:translateY(-45px) rotate(0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(98vh) rotate(700deg)}}

@media(max-width:1250px) {.v2-hero {padding:32px}.insight-summary {grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:990px) {.journey-ribbon {grid-template-columns:1fr 1.4fr;gap:16px}.ribbon-total {display:none}.insight-main {grid-template-columns:1fr}.v2-hero h2 {font-size:31px}}

  .v2-hero .ring-middle b {font-size:34px}

  .journey-ribbon h2 {font-size:25px}
  .journey-main {min-width:0}
  .ribbon-sub {font-size:8px}
  .daily-hero-meter {gap:10px;flex-wrap:nowrap}

  .daily-hero-meter p {font-size:10px}

  .explorer-card,.chapter-card {padding:18px 14px}
  .explorer-top {align-items:flex-start}
  .period-bars {gap:7px}

  .chapter {display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:11px}
  .chapter>span {grid-column:1;text-align:left}

  .shop-grid {grid-template-columns:1fr}

  .reward-wallet {padding:20px;display:block}

}

 .settings-grid,.page-grid,.insight-four,.rewards-grid,.template-grid {grid-template-columns:minmax(0,1fr)}

/* ───────────────── Ninety 3.0 / a calm, tactile design system ───────────────── */
:root{--bg:#f5f8f5;--surface:#ffffff;--surface2:#f0f5f2;--ink:#172b2b;--muted:#607b78;--line:#e0e9e3;--accent:#346d61;--accent-dark:#285c50;--accent-wash:#e1f4e9;--green:#238368;--green-wash:#e0f7ed;--orange:#d89955;--shadow:0 12px 35px rgba(25,61,47,.038);--radius:22px}
:root[data-theme='dark']{--bg:#0e1d20;--surface:#172a2c;--surface2:#1f3537;--ink:#eff8f4;--muted:#b2c8c0;--line:#304a48;--accent:#a2e7ca;--accent-dark:#72d7b3;--accent-wash:#263f3b;--green:#8eddb8;--green-wash:#264b41;--orange:#efbf8b}
body{font-size:14px;line-height:1.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button,input,select,textarea{font-size:max(14px,1em)}
button:not(:disabled){-webkit-tap-highlight-color:transparent}
.sidebar{background:var(--surface)}.nav-item{min-height:45px}.nav-item.active{font-weight:820}
.brand-symbol{background:#173535;color:#b8f5d4}.brand-tag{letter-spacing:.12em}
.v2-hero{background:radial-gradient(ellipse at 78% 5%,#477e74 0,transparent 45%),linear-gradient(117deg,#172d32 0%,#214343 65%,#276554 100%);box-shadow:0 19px 50px rgba(20,54,46,.13)}
.v2-hero h2 em{color:#b9f0c6}.v2-hero .hero-tag{color:#d5f4df}.v2-hero .ring-wrap svg circle:last-child{stroke:#b9eed0}.v2-hero .hero-decoration{color:rgba(229,255,237,.05)}
.stat-card{border-radius:19px}.progress-fill{background:linear-gradient(90deg,#398573,#92d8af)}
.segmented button.active{color:var(--accent)}.seven-bars .seven-pillar i,.period-column>span{background:linear-gradient(180deg,#b2e9cb,var(--accent))}
.pill-date{font-size:12px}.header-actions{display:flex;gap:9px;flex-wrap:wrap}
.content{max-width:1480px}.sidebar{padding-top:28px}
.mini-eyebrow{letter-spacing:.14em}.btn-primary{font-size:13px}.btn,.icon-btn,.tiny-ic,.step-btn,.tick{min-height:42px}
.step-btn{min-height:34px;min-width:31px}.tick{min-width:38px}.habit-row{min-height:85px}.habit-detail,.habit-name,.stat-heading span{font-size:12px}.section-sub,.stat-foot{font-size:12px}
.account-open{border:0;cursor:pointer}.account-open:hover{box-shadow:0 0 0 3px var(--accent-wash)}
/* Focus studio */
.studio-layout{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(310px,.78fr);gap:19px;align-items:start}
.studio-primary{background:linear-gradient(145deg,#152e34,#22464b 60%,#2c5b52);color:#f0fff8;border-color:rgba(44,95,85,.8);padding:25px 32px 20px;position:relative;overflow:hidden;box-shadow:0 17px 40px rgba(9,44,38,.1)}
.studio-primary:before{content:'';position:absolute;right:-120px;top:-150px;width:390px;height:390px;background:radial-gradient(circle,rgba(171,240,201,.14),transparent 64%);border-radius:50%;pointer-events:none}
.studio-primary:fullscreen{height:100vh;border-radius:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.studio-topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px;font-size:10px;font-weight:850;letter-spacing:.15em;color:#c7eddc;position:relative}
.studio-topline>span{display:inline-flex;align-items:center;gap:8px}.studio-beacon{display:inline-block;width:8px;height:8px;border-radius:50%;background:#acf1c9;box-shadow:0 0 0 5px rgba(166,237,193,.14)}
.studio-icon-btn{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);color:#e8fff2;border-radius:12px;padding:8px 10px;min-height:40px;font-size:11px}
.studio-mode{display:flex;gap:4px;padding:5px;background:rgba(6,26,27,.28);border-radius:14px;max-width:480px;margin:auto;position:relative}
.studio-mode button{flex:1;border:0;background:transparent;color:#b2d2ce;font-size:11px;font-weight:750;padding:10px 7px;border-radius:10px;min-width:0}
.studio-mode button.active{color:#15362d;background:#d1f5df;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.studio-center{display:grid;place-items:center;margin:29px 0 21px}
.studio-orbit{width:min(330px,100%);aspect-ratio:1;border-radius:50%;padding:13px;background:conic-gradient(#a9edcc var(--deg),rgba(255,255,255,.11) 0);box-shadow:0 0 0 12px rgba(218,255,225,.025),0 0 0 24px rgba(218,255,225,.018);transition:background .2s}
.studio-orbit-inner{height:100%;width:100%;border-radius:50%;background:radial-gradient(circle at 30% 10%,#29575b,#18363a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.studio-orbit-inner:before{content:'✧';font-size:100px;line-height:1;color:rgba(167,252,217,.045);position:absolute;right:18px;top:3px}
.studio-orbit-inner>span{font-size:10px;font-weight:850;letter-spacing:.22em;color:#b2dfcb}.studio-time{font-size:clamp(52px,6vw,78px);letter-spacing:-.075em;line-height:1.3;font-weight:720;font-variant-numeric:tabular-nums;margin:9px 0;color:#f8fff9}
.studio-orbit-inner p{margin:0;font-size:11px;color:#b8d9d1;letter-spacing:.025em}
.studio-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.studio-presets button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#d6f4e7;border-radius:10px;padding:8px 13px;font-weight:750;font-size:12px;min-height:37px}.studio-presets button.active{color:#15372c;background:#d0f4e0}
.studio-controls{display:flex;align-items:stretch;gap:8px;margin:24px 0}.studio-controls .btn{border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.12);color:#f8fff9;flex:1;min-width:0;white-space:normal;text-align:center;min-height:48px;font-size:12px}.studio-controls .studio-start{background:#b6edce;color:#14392e;flex:1.6;border-color:#b6edce;font-weight:850}.studio-controls .studio-start:hover{background:#d3ffe2;box-shadow:0 6px 20px rgba(110,205,154,.16)}
.studio-rounds{display:flex;gap:10px;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#b5cfc9;letter-spacing:.08em}.studio-rounds>div{display:flex;gap:6px}.studio-rounds>div span{width:21px;height:6px;background:#567475;border-radius:8px}.studio-rounds>div .done{background:#a6ecc7}.studio-rounds>div .current{background:#daf4df;box-shadow:0 0 0 2px rgba(200,247,218,.16)}.studio-footnote{text-align:center;font-size:10px;line-height:1.65;color:#a0bfbc;margin:20px 0 0}
.studio-sidebar{display:grid;gap:17px;min-width:0}.studio-sidebar .card{padding:23px}.studio-intention h3{font-size:21px;letter-spacing:-.04em;margin:0 0 18px}.studio-intention .field{margin-bottom:17px}.studio-intention-hint{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}.studio-sound .section-header{align-items:start}

  function growthCompass(){
    const today=dateLocal(),days=Array.from({length:14},(_,i)=>shiftDay(today,i-13)).filter(d=>d>=state.settings.startDate&&d<=endDate());
    const areas=[...new Set(state.habits.map(x=>x.category||'Personal'))];
    const items=areas.map(name=>{
      let done=0,total=0;for(const d of days)for(const habit of state.habits){if((habit.category||'Personal')!==name||!scheduled(habit,d))continue;total++;if(completed(habit,d))done++;}
      return {name,done,total,pct:total?Math.round(100*done/total):0};
    }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total).slice(0,6);
    return `<section class="card v5-compass"><div class="section-header"><div><span class="v5-caption">YOUR BALANCE</span><h2 class="section-title">Progress in every part of life</h2><p class="section-sub">14-day scheduled check-in rates, grouped by your habit categories.</p></div></div><div class="v5-compass-grid">${items.map((x,i)=>`<div class="v5-compass-item"><div class="v5-compass-ring" style="--p:${x.pct}%"><div><strong>${x.pct}%</strong><small>${x.done}/${x.total}</small></div></div><b>${h(x.name)}</b><span>${x.total} scheduled check-ins</span></div>`).join('')||'<p class="section-sub">Track a few habits to see your personal balance.</p>'}</div><p class="v5-lens-note">This is a view of recorded habits, not an assessment of health, character, or potential.</p></section>`;
  }

  function exportCalendar(){const entries=[];const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');const start=state.settings.startDate, end=endDate(),today=dateLocal();let count=0;

  function cloudUrl(path){return CONFIG.url.replace(/\/$/,'')+path;}

  function storeSession(session){

  async function ensureToken(){

  async function handleAuth(vals){
    if(!cloudEnabled){toast('Connect Supabase first. See setup guide.');return;}
    if(authMethod==='update-password'){
      const password=String(vals.get('password')||'');
      if(password.length<6){toast('Password must be at least 6 characters.');return;}
      authBusy=true;render();
      try{
        const token=await ensureToken();
        const user=await cloudRequest('/auth/v1/user',{method:'PUT',token,body:{password}});
        toast('Password updated successfully! Welcome back.');
        authMethod='signin';
        if(user?.id)await bootstrapAccount(user);
        else{ui.authGate=false;render();}
      }catch(e){authBusy=false;toast(`Could not update password: ${e.message}`);render();}
      return;
    }
    const email=String(vals.get('email')||'').trim();
    if(authMethod==='forgot'){
      if(!email||!email.includes('@')){toast('Enter a valid email address.');return;}
      authBusy=true;render();
      try{
        await cloudRequest('/auth/v1/recover',{method:'POST',body:{email}});
        toast('Password recovery link sent! Check your email.');
        authMethod='signin';
      }catch(e){toast(`Recovery request failed: ${e.message}`);}
      finally{authBusy=false;render();}
      return;
    }
    const password=String(vals.get('password')||'');
    if(!email||password.length<6){toast('Enter a valid email and password (6+ characters).');return;}
    authBusy=true;render();
    try{
      const isUp=authMethod==='signup';
      const data=await cloudRequest(isUp?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});
      if(!data.access_token){toast('Check your email to confirm your address, then sign in.');authMethod='signin';authBusy=false;render();return;}
      storeSession(data);await bootstrapAccount(data.user);
    }catch(e){
      authBusy=false;
      const msg=e.message||'';
      if(msg.includes('ninety_profiles')||msg.includes('PGRST205')){
        toast('Database table missing. Please run supabase/schema.sql in your Supabase SQL editor.');
      }else{
        toast(`Sign-in failed: ${msg}`);
      }
      render();
    }
  }
  async function handleAuthRedirect(){
    if(!cloudEnabled)return false;
    const hash=window.location.hash||'';
    const search=window.location.search||'';
    let params=null;
    if(hash.includes('access_token=')){
      params=new URLSearchParams(hash.replace(/^#/,''));
    }else if(search.includes('code=')){
      params=new URLSearchParams(search.replace(/^\?/,''));
    }
    if(!params)return false;
    const access_token=params.get('access_token');
    const refresh_token=params.get('refresh_token');
    const expires_in=Number(params.get('expires_in')||3600);
    const type=params.get('type');
    const errorDesc=params.get('error_description')||params.get('error');

    if(errorDesc){
      toast(`Authentication alert: ${decodeURIComponent(errorDesc)}`);
      try{if(window.history?.replaceState)window.history.replaceState(null,'',window.location.pathname||'/');}catch{}
      return false;
    }

    if(access_token){
      try{if(window.history?.replaceState)window.history.replaceState(null,'',window.location.pathname||'/');}catch{}
      const session={
        access_token,
        refresh_token:refresh_token||access_token,
        expires_at:Math.floor(Date.now()/1000)+expires_in
      };
      storeSession(session);
      if(type==='recovery'){
        ui.authGate=true;
        authMethod='update-password';
        toast('Recovery link verified. Please choose your new password.');
        render();
        return true;
      }
      try{
        const user=await cloudRequest('/auth/v1/user',{token:access_token});
        if(user?.id){
          toast('Signed in successfully. Welcome to AVENORY!');
          await bootstrapAccount(user);
          return true;
        }
      }catch(err){
        console.warn('Auth redirect user retrieval error:',err);
      }
    }
    return false;
  }
  function restoreAccountCache(note='Using saved account on this device'){
    const user=cloudSession?.user || rememberedUser;

    account={id:user.id,email:user.email||''};currentStore=localCacheKey(account.id);
    try{const raw=localStorage.getItem(currentStore);if(raw)state=sanitizeState(JSON.parse(raw));}
    catch(e){console.warn('Account cache cannot be read:',e);}

  }
  async function resumeAuth(){
    if(!cloudEnabled)return;
    try{
      const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;
      cloudSession=JSON.parse(saved);
      if(!navigator.onLine){restoreAccountCache('Offline · changes stay on this device');return;}
      const token=await ensureToken();
      const user=await cloudRequest('/auth/v1/user',{token});
      if(user?.id)await bootstrapAccount(user);
    }catch(e){
      const message=String(e.message||'');
      const invalid=/invalid refresh token|refresh token not found|invalid jwt|jwt expired|401|403|session not found/i.test(message);
      if(invalid){
        cloudSession=null;account=null;localStorage.removeItem(SESSION_KEY);
        currentStore=STORE;state=loadState();cloudStatus='Your session expired. Sign in to continue.';
        ui.authGate=true;render();
      }else if(!restoreAccountCache('Connection interrupted · your session and progress are kept')){
        cloudStatus='Cannot reach the service. Please try again.';render();
      }
    }
  }

  async function resolveConflict(choice){if(!account)return;
    try{
      const row=await remoteRow();if(choice==='cloud'){
        if(!confirm('Use cloud data? This device’s unsynced version will be downloaded as a backup first.'))return;
        exportJson();state=sanitizeState(row?.data||freshState());cloudRevision=Number(row?.revision||0);unsynced=false;cloudError='';cloudStatus='Cloud version restored';localStorage.setItem(currentStore,JSON.stringify(state));setCloudMeta({revision:cloudRevision,dirty:false});render();toast('Cloud data restored; previous data backed up.');return;
      }
      if(!confirm('Use this device’s version? The existing cloud version will be backed up first. Other devices will see the replacement after sync.'))return;
      // Preserve both sides before an explicitly authorized conflict resolution.
      exportJson();
      if(row?.data)dataDownload(`avenory-cloud-before-conflict-${dateLocal()}.json`,JSON.stringify(row.data,null,2),'application/json');
      cloudRevision=Number(row?.revision||0);
      cloudError='';unsynced=true;syncCount++;

      if(cloudError){toast('Another edit arrived. Please review the conflict again; your device copy is safe.');}

  // ─── 3.0 · Focus Studio ───
  function focusDuration(mode){return (mode==='focus'?focusPrefs.focus:mode==='short'?focusPrefs.short:mode==='long'?focusPrefs.long:focusPrefs.focus)*60;}
  function formatClock(seconds){seconds=Math.max(0,Math.floor(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds/60)%60,s=seconds%60;return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function timerSetMode(mode){if(!['focus','short','long','stopwatch'].includes(mode))return;if(focusRun.running&&!confirm('Pause your current session and switch modes? The incomplete session will not be logged.'))return;focusRun.mode=mode;focusRun.running=false;focusRun.elapsed=0;focusRun.remaining=mode==='stopwatch'?0:focusDuration(mode);focusRun.duration=focusDuration(mode);focusRun.end=0;focusRun.startedAt=0;focusRun.startMs=0;persistFocus();render();}
  function timerLength(n){if(!Number.isInteger(n)||n<1||n>180)return;if(focusRun.running) {toast('Pause or reset your current session before changing duration.');return;}focusPrefs.focus=n;focusRun.mode='focus';focusRun.remaining=n*60;focusRun.duration=n*60;focusRun.elapsed=0;focusRun.startedAt=0;focusRun.end=0;focusRun.startMs=0;persistFocus();render();}
  function timerToggle(){

  }
  function timerReset(){if(focusRun.running&&!confirm('Reset this session? Incomplete time will not be logged.'))return;focusRun.running=false;focusRun.remaining=focusRun.mode==='stopwatch'?0:focusDuration(focusRun.mode);focusRun.duration=focusDuration(focusRun.mode);focusRun.elapsed=0;focusRun.startedAt=0;focusRun.end=0;focusRun.startMs=0;persistFocus();render();}

  function timerStopwatchDone(){if(focusRun.mode!=='stopwatch')return;const elapsed=focusRun.running?Math.floor((Date.now()-focusRun.startMs)/1000):focusRun.elapsed;const minutes=Math.floor(elapsed/60);if(minutes<1){toast('Complete at least 1 minute to log a stopwatch session.');return;}if(!confirm(`Finish and record ${minutes} focused minutes?`))return;recordFocus(minutes,'stopwatch');focusRun.running=false;focusRun.elapsed=0;focusRun.startedAt=0;focusRun.startMs=0;persistFocus();render();toast(`${minutes} minutes recorded. Great effort!`);}

  function recordFocus(minutes,mode){

    if(form.getAttribute('id')==='park-form'){const thought=String(vals.get('thought')||'').trim().slice(0,180);if(!thought)return;(state.parkedThoughts||=[]).push({id:newId('thought'),text:thought,date:dateLocal()});save();render();toast('Parked for later. Your focus is protected.');return;}
    if(form.getAttribute('id')==='focus-goal-form'){const hours=Number(vals.get('hours'));if(!Number.isFinite(hours)||hours<.5||hours>80){toast('Choose a weekly target between 0.5 and 80 hours.');return;}state.settings.weeklyFocusHours=hours;save();render();toast('Focus target updated.');return;}
    if(form.getAttribute('id')==='northstar-form'){state.settings.northStar=String(vals.get('northStar')||'').trim().slice(0,150);save();render();toast('North star saved. Return to it when your day gets loud.');return;}
    if(form.getAttribute('id')==='auth-form'){void handleAuth(vals);return;}
    if(form.getAttribute('id')==='focus-settings-form'){applyFocusSettings(vals);return;}
    if(form.getAttribute('id')==='reward-form'){const title=String(vals.get('title')||'').trim();const cost=Number(vals.get('cost'));if(!title||!Number.isInteger(cost)||cost<50||cost>10000){toast('Enter a reward name and XP cost from 50 to 10,000.');return;}(state.customRewards||=[]).push({id:newId('custom'),title:title.slice(0,80),description:String(vals.get('description')||'').slice(0,180),cost});save();closeModal();render();toast('Your personal reward is ready!');return;}
    if(form.getAttribute('id')==='habit-form'){
      const id=String(vals.get('id')||'');const old=state.habits.find(x=>x.id===id);
      const title=String(vals.get('title')||'').trim(),days=vals.getAll('days').map(Number);if(!title||!days.length){toast('Add a name and choose at least one weekday.');return;}
      const kind=String(vals.get('kind')||'binary');const target=kind==='binary'?1:Number(vals.get('target'));const step=kind==='binary'?1:Number(vals.get('step'));if(!['binary','min','max'].includes(kind)||!(target>0)||!(step>0)){toast('Please enter a positive target and increment.');return;}
      const item={id:old?.id||newId('habit'),title:title.slice(0,70),caption:String(vals.get('caption')||'').slice(0,120),icon:ICONS.has(vals.get('icon'))?vals.get('icon'):'target',color:['blue','green','orange'].includes(vals.get('color'))?vals.get('color'):'blue',category:String(vals.get('category')||'Growth'),kind,target:round(target),unit:kind==='binary'?'':String(vals.get('unit')||'min').slice(0,16),step:round(step),days,startDate:String(vals.get('startDate')||dateLocal()),reminder:String(vals.get('reminder')||''),points:[10,20,30].includes(Number(vals.get('points')))?Number(vals.get('points')):20};
      if(old)Object.assign(old,item);else state.habits.push(item);save();closeModal();render();toast(old?'Habit updated.':'New habit added!');return;
    }
    if(form.getAttribute('id')==='project-form'){
      const id=String(vals.get('id')||'');const old=state.projects.find(x=>x.id===id);
      const title=String(vals.get('title')||'').trim(),durationDays=Number(vals.get('durationDays')),dailyMinutes=Number(vals.get('dailyMinutes'));
      if(!title||!Number.isInteger(durationDays)||durationDays<1||durationDays>90||dailyMinutes<5||dailyMinutes>1440){toast('Check the project title, days, and minutes.');return;}
      const item={id:old?.id||newId('project'),title:title.slice(0,80),description:String(vals.get('description')||'').slice(0,350),category:String(vals.get('category')||'Learning'),durationDays,dailyMinutes,startDate:String(vals.get('startDate')||dateLocal()),icon:old?.icon||'target'};
      if(old)Object.assign(old,item);else state.projects.push(item);save();closeModal();render();toast(old?'Project updated.':'Your new project is ready.');return;
    }
    if(form.getAttribute('id')==='settings-form'){
      const date=String(vals.get('startDate')||'');if(!/^\d{4}-\d\d-\d\d$/.test(date)||date>dateLocal()){toast('Start date cannot be in the future.');return;}
      state.settings.name=String(vals.get('name')||'You').trim().slice(0,35)||'You';state.settings.startDate=date;state.settings.theme=vals.get('theme')==='dark'?'dark':'light';ui.date=clampDate(dateLocal());save();render();toast('Preferences saved.');return;
    }
    if(form.getAttribute('id')==='reminder-form'){state.settings.morning=String(vals.get('morning')||'08:00');state.settings.evening=String(vals.get('evening')||'21:00');save();render();toast('Reminder times updated.');}
  }
  let noteSaveHandle=null,noteDirty=false;
  function flushNoteDraft(){
    if(noteSaveHandle){clearTimeout(noteSaveHandle);noteSaveHandle=null;}
    if(!noteDirty)return;
    noteDirty=false;save();
    const status=document.getElementById('note-save-status');
    if(status)status.textContent=account?'✓ Saved · syncing securely':'✓ Saved on this device';
  }
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el?.dataset?.note===undefined)return;
    const day=chosenDate();editLog(day).note=String(el.value||'').slice(0,1200);
    noteDirty=true;clearTimeout(noteSaveHandle);
    const status=document.getElementById('note-save-status');if(status)status.textContent='Saving…';
    noteSaveHandle=setTimeout(flushNoteDraft,480);
  });
  window.addEventListener('pagehide',flushNoteDraft);
  document.addEventListener('click',handleClick);
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change',async e=>{
    const el=e.target;
    if(el.dataset.qtyInput){writeQuantity(el.dataset.qtyInput,el.value);return;}
    if(el.dataset.lensHabit){ui.habitDetail=el.value;render();return;}
    if(el.dataset.focusTarget){ui.focusTarget=el.value;focusRun.target=el.value;persistFocus();return;}
    if(el.dataset.focusTask!==undefined){focusRun.task=el.value.slice(0,160);persistFocus();return;}
    if(el.dataset.notificationToggle!==undefined){await enableNotification(el.checked);return;}
    if(el.id==='northstar'){state.settings.northStar=String(el.value||'').trim().slice(0,150);save();toast('North star saved.');return;}
    if(el.dataset.importFile!==undefined){const file=el.files&&el.files[0];if(!file)return;try{
        if(file.size>5_000_000)throw Error('Backup too large');const obj=JSON.parse(await file.text());
        if(!obj||!Array.isArray(obj.habits)||!Array.isArray(obj.projects)||!obj.settings||!obj.logs||!/^\d{4}-\d\d-\d\d$/.test(obj.settings.startDate))throw Error('Not a valid backup file');
        if(!confirm('Replace all current local data with this backup? We recommend exporting a backup first.')){el.value='';return;}
        state=sanitizeState(obj);ui.date=dateLocal();save();render();toast('Backup imported successfully.');
      }catch(err){toast(`Could not import: ${err.message}`);}finally{el.value='';}return;}
    if(el.id==='habit-kind'){const area=document.getElementById('habit-number-fields');if(area)area.style.display=el.value==='binary'?'none':'block';return;}
    if(el.dataset.note!==undefined){flushNoteDraft();return;}
  });
  document.addEventListener('click',e=>{if(e.target.matches('[data-dismiss-overlay]')){clearInterval(breathHandle);closeModal();} if(e.target.matches('[data-command-close]'))closeCommand();});
  document.addEventListener('keydown',e=>{
    const modalRoot=document.getElementById('modal-root'),panel=modalRoot?.querySelector('.modal-panel');
    const cmdRoot=document.getElementById('command-root'),cmdPanel=cmdRoot?.querySelector('.v4-command-modal');
    const activeDialog=panel||cmdPanel;
    if(activeDialog){
      if(e.key==='Escape'){clearInterval(breathHandle);closeModal();closeCommand();return;}
      if(e.key==='Tab'){
        const focusables=Array.from(activeDialog.querySelectorAll('button:not([disabled]),input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]'));
        if(focusables.length>0){
          const first=focusables[0],last=focusables[focusables.length-1];
          if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
          else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
        }
      }
      return;
    }
    if(e.key==='Escape'){clearInterval(breathHandle);closeModal();closeCommand();}
    if(e.key==='/'&&!e.target.closest('input,textarea,select,[contenteditable]')){e.preventDefault();openCommand();}
    if(e.key==='Enter'&&e.target.matches('[data-quick-qty]')){e.preventDefault();e.target.click();}
    if(ui.page==='focus'&&!ui.authGate&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,select,button,[contenteditable]')){
      if(e.code==='Space'){e.preventDefault();timerToggle();}
      else if(e.key.toLowerCase()==='r'){timerReset();}
      else if(e.key.toLowerCase()==='f'){timerFullscreen();}
    }
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickTimer();checkReminders();if(account)void refreshCloud();}});
  window.addEventListener('online',()=>{if(account)void flushSync();});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache unavailable:',e)));
  }
  let lastDaySeen=dateLocal();
  let lastQuoteKey='';
  function updateDailyClock(){
    const day=dateLocal();
    if(day!==lastDaySeen){
      flushNoteDraft();lastDaySeen=day;ui.date=day;
      render();toast('A new day is here. Your earlier check-ins are safely in your history.');
      return;
    }
    if(ui.page==='overview'&&!ui.authGate){
      const s=quoteSelection('moment'),key=`${s.context}:${s.index}`;
      if(lastQuoteKey!==key){lastQuoteKey=key;const old=document.querySelector('[data-quote-panel]');if(old&&old.dataset.quoteKey!==key){
        const fresh=document.createElement('div');fresh.innerHTML=liveQuote();const next=fresh.firstElementChild;
        next.classList.add('avenory-editorial-enter');old.replaceWith(next);
      }}
    }
  }
  setInterval(()=>{tickTimer();checkReminders();},1000);
  setInterval(updateDailyClock,12000);
  setInterval(()=>{
    if(ui.authGate)return;
    document.querySelectorAll('.avenory-field-strip').forEach(el=>{
      const context=el.dataset.fieldNote;
      const current=quoteSelection(context);
      const active=el.querySelector('.avenory-strip-words p');
      if(active&&active.textContent!==current.line){
        active.textContent=current.line;
        const small=el.querySelector('.avenory-strip-words small');if(small)small.textContent=current.aside;
        el.classList.remove('field-fresh');void el.offsetWidth;el.classList.add('field-fresh');
      }
    });
  },30000);
  setInterval(()=>{if(account&&!unsynced&&!syncInFlight)void refreshCloud()},45000);
  render();
  (async()=>{
    const handled=await handleAuthRedirect();
    if(!handled)await resumeAuth();
  })();
  tickTimer();
  checkReminders();
})();

</script>
